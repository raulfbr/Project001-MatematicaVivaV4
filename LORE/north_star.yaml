# Dicionário de abreviações (keys descritivas)
_dict:
  desc: descricao
  apply: aplicacao
  q: pergunta
  n: numero
  msg: mensagem
  ref: referencia
  req: requerido
  opt: opcional

# IDENTIDADE FUNDAMENTAL (Deliberação 19/01/2026)

identidade:
  slogan: "Histórias que ensinam. Narração que fixa."
  slogan_secundario: "Da Família Rodrigues para outras famílias"
  familia:
    - {nome: Raul, papel: Pai Professor Matemática, titulo: Maestro Fundador}
    - {nome: Marina, papel: Mãe Pedagoga, titulo: Auxiliadora co-fundadora}
    - {nome: Raulzito, papel: Filho 5 anos, titulo: Filho aventureiro}
    - {nome: Mel, papel: Filha curiosa, titulo: Filha aventureira}
  frase_central: |
    Isso não é uma empresa vendendo produto. Somos uma família que queria isso para nossos filhos. Não encontramos. Então criamos — e agora compartilhamos.
  tribo: "Famílias Pioneiras"
  diferencial_cpa: "Charlotte Mason + Bruner autêntico (espiral), não Singapura (repetição)"
  credo_reino: "O Reino não acaba quando a lição termina. Ele vive no coração do Herdeiro."

# ESTRUTURA DE COMUNICAÇÃO (3 Níveis)
comunicacao_estruturada:
  nivel_1:
    tempo: "5 segundos"
    foco: "Slogan"
    conteudo: "Histórias que ensinam. Narração que fixa."
  
  nivel_2:
    tempo: "30 segundos"
    foco: "Desenvolvimento"
    para_voce_pai: "✅ ABRA E FAÇA → 5 minutos de preparo. Pronto para usar."
    para_seu_filho: 
      - "📖 OUVE → Ele ouve aventuras onde a matemática emerge"
      - "🗣️ CONTA → Ele conta o que descobriu (sem provas)"
      - "🔄 REENCONTRA → Os conceitos retornam, mais profundos"
    logica: "Pai primeiro (praticidade), filho depois (experiência)."

  nivel_3:
    tempo: "1 minuto"
    foco: "Completo (Janice/CMC)"
    blocos:
      - "Matemática Viva é um currículo de matemática Charlotte Mason."
      - "Cada lição é uma narrativa imersiva — o Reino Contado, com 5 Guardiões."
      - "Usamos CPA de Bruner (mãos primeiro) e currículo espiral. (Não é Singapura de repetir lições — é espiral de ensino verdadeiro.)"
      - "E a narração: seu filho conta o que aprendeu."
      - "Criado pela Família Rodrigues — família CM para famílias CM."

# TOM DE COMUNICAÇÃO (Deliberação 20/01/2026)
tom_comunicacao:
  principio: "O medo acaba em você. O encantamento começa neles."
  
  publico_alvo: "Famílias que querem sentar ao lado e ver o brilho nos olhos acontecer."
  
  posicionamento:
    essencia: "Prático para você. Profundo para seu filho. Imersivo para os dois."
    mensagem: "5 minutos de preparo. Histórias que encantam. Conceitos que crescem junto com ele."
    convite: "De família para família — as portas do Reino já estão abertas."
  
  palavras_evitar: [odeia, trauma, difícil, chato, obrigação]
  palavras_preferir: [brilho, mistério, segredo, aventura, conquista]
  
  tom: "Redentor para o pai. Encantador para o filho."
  
  contraste_geracional:
    pai_sente: "Alívio. 'Não é culpa minha, e não é tarde demais.'"
    filho_sente: "Fascínio. 'A matemática é um reino, não uma lista de tarefas.'"
  
  exemplo_ruim: "Seu filho não vai odiar matemática como você."
  exemplo_bom: "Você tem a chance de reescrever a história da matemática na sua casa. Onde houve medo, haverá memória."
  
  abordagem_trauma: "O adulto cura sua ferida ao ver o filho brilhar. Um processo de via dupla."

# 5 PRINCÍPIOS INEGOCIÁVEIS (Deliberação 19/01/2026)

principios_5:
  slogan: "Seu filho OUVE, CONTA, e REENCONTRA."
  lista:
