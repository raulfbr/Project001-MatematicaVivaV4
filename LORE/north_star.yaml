  - {id: 3, name: "Foco no Positivo (Tom Redentor)", desc: "Nunca vender pelo medo. Convites gentis.", frase: "O medo acaba em você. O encantamento começa neles.", expert: [Embaixador, CS Lewis], apply: [Palavras preferir (brilho aventura)], q: "Isso encoraja ou desanima?"}
  - {id: 4, name: "Identidade Tribal", desc: "Não suporte. PERTENCER. People like us.", frase: "Esta não é uma audiência. É uma tribo.", expert: [Seth Godin, Peter Thiel], apply: [Preço por LAR não por cabeça], q: "Fortalece tribo ou dilui?"}
  - {id: 5, name: "Unidade Familiar (Cultura do Reino)", desc: "Um Reino só para TODOS (0-18 + Pais). Facilitador de comunicação.", frase: "Não é só aula, é cultura de lar.", expert: [Tolkien, Vygotsky], apply: [Guardiões universais, Pais Regentes], q: "A família inteira fala a mesma língua?"}
  - {id: 6, name: "Norte Seguro + Flexibilidade", desc: "CORE inegociável + alternativas para adaptar.", frase: "O Mapa é fixo. O caminho, você escolhe.", expert: [Charlotte Mason, BMAD], apply: [Template + adaptação], q: "Pai sabe adaptar sem perder norte?"}
  - {id: 7, name: "Soberania Intelectual", desc: "Não vendemos medo (BNCC). Vendemos poder e oportunidade global.", frase: "Soberania Intelectual > Segurança Jurídica.", expert: [Thiel, Godin], apply: [Mirar global, BNCC é consequência], q: "Empodera a família ou a torna dependente?"}
  - {id: 8, name: "Beleza Redentora", desc: "A estética cura. Arte é generosidade, não decoração.", frase: "Beleza não é luxo. É caminho de volta.", expert: [Fujimura, Potter], apply: [Ilustrações que acalmam PAI e encantam FILHO], q: "Traz paz ao pai e maravilha ao filho?"}
