  1_raizes: {ciclo: Raízes, viajante: Construtor, idade: "6-7 anos", phrase: "Sou o Construtor da Vila", elab: "Usa promessas para CONSTRUIR. Número serve propósito - medir, contar, organizar. Sai jardim, entra oficina Bernardo. AVENTURA CONSTRUTIVA."}
  2_raizes: {ciclo: Raízes, viajante: Construtor, idade: "7-8 anos", phrase: "O Mercado me ensina justiça", elab: "Troca, compara, equilibra. Matemática = moeda de relação. Zelo e honestidade. TROCAS JUSTAS."}
