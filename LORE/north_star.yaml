principios_fundamentais:
  # 9 Princípios Fundamentais v1.3 (Deliberação 19/01/2026)
  - {id: 1, name: "Qualidade Não é Negociável", desc: "Buscamos IMPECÁVEL sempre. 3 lições impecáveis > 10 boas.", frase: "Se não é excelente, não é nosso.", expert: [Tolkien, Engenharia], apply: [QA Quíntupla obrigatória], q: "Isso é BOM ou ÓTIMO?"}
