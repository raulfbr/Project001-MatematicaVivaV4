    - {id: 2, nome: DESCOBERTA, frase_mae: "Mãos primeiro, mente depois", origem: "Jerome Bruner CPA", desc: "Mente precisa TOCAR antes de VER antes de SIMBOLIZAR."}
    - {id: 3, nome: ESPIRAL, frase_mae: "O que planta hoje, floresce amanhã", origem: "Bruner Spiral", desc: "Conceitos RETORNAM mais profundos. Crescimento, não repetição.", apply: [LORE 0-18, Base prepara próximo]}
    - {id: 4, nome: NARRAÇÃO, frase_mae: "Conta o que aprendeu — sem provas", origem: "CM Princípio 11", desc: "Criança RECONTA em palavras próprias. Substitui testes."}
