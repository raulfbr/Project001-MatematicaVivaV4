# LIÇÃO 001 - A TRINDADE NA PALMA
# Template: V6.5 | 04/03/2026 | Status: REVISAO_NARRATIVA_PREMIUM

_meta:
  id: licao-001-trindade-palma
  versao: "6.5"
  fase: Sementes
  status: revisado

licao:
  metadados:
    id: MV-S-001
    titulo: A Trindade na Palma
    fase: Sementes
    ciclo: K
    trimestre: 1
    estacao: 1
    tipo: Senso Numérico
    guardiao_lider: celeste
    guardiao_secundario: melquior
    guardioes_apresentados: [celeste]
    tgtb_ref: 000-L1
    tgtb_titulo_en: Numbers 1 to 3
    tgtb_titulo_pt: Números 1 a 3
    objetivo_pedagogico: Contagem de 1 a 3 com correspondência um-a-um e percepção tátil.
    tempo_licao: "15-20 min"
    tempo_preparo: "≤ 5 min"
    versao: "6.5"
    status: revisado

  navegacao:
    anterior:
      id: MV-S-000
      titulo: O Portal do Reino
    proxima:
      id: MV-S-002
      titulo: As Pedras da Fortaleza

  para_portador:
    ideia_viva:
      frase: "Três sementes de carvalho, três promessas guardadas na palma da mão."
      conceito: Cada número nasce do encontro entre olhar, toque e palavra.
      intencao_cm: A criança vive o número antes de nomeá-lo como símbolo.
    dica_coracao: |
      Esta lição é pequena por fora e profunda por dentro.
      Seu papel não é acelerar a criança, mas acender atenção serena.
      Hoje, o 1, o 2 e o 3 entram pela mão e pelo coração.
    filho_descobre: |
      Que número é quantidade real, não apenas som.
      Que três objetos podem ser percebidos, tocados e contados com calma.
    protocolo_impecabilidade: |
      Mostre antes de explicar.
      Entregue uma semente por vez, com pausas curtas entre cada passo.
      Conte junto; não transforme o momento em teste.
    nota_graca: |
      Se houver tropeço na contagem, apenas recomece sem tensão.
      O progresso está na atenção compartilhada.
    conforto_emocional: |
      Você não precisa performar.
      Presença tranquila já é pedagogia de alta qualidade.
    audio_script: |
      Portador, a clareira está pronta.
      Hoje Celeste confia a vocês três tesouros simples: um, dois e três.
    preparacao:
      materiais:
        - item: "3 sementes, feijões ou pedrinhas"
          qtd: 3
          alt: "3 botões de tamanho parecido"
          essencial: true
          nota: "Objetos fáceis de segurar."
        - item: "Card Celeste"
          qtd: 1
          alt: "Imagem da guardiã"
          essencial: true
          nota: "Opcional para famílias sem card."
        - item: "Cestinho pequeno"
          qtd: 1
          alt: "Tigela ou prato"
          essencial: false
          nota: "Ajuda no movimento de guardar e trazer."

  linkage:
    elo_anterior:
      licao_id: MV-S-000
      gancho: O Portal abriu o coração da criança para o Reino; agora começamos a primeira descoberta numérica.
    proximo:
      licao_id: MV-S-002
      gancho: Depois de contar tesouros, Bernardo convidará a organizar pedras em fileiras.

  ritual_abertura:
    instrucao_ambiente: Tapete estendido, objetos à vista e poucos estímulos no entorno.
    local: clareira_perguntas
    clima: ensolarado
    virtude: curiosidade
    artefato: Três sementes de carvalho
    transicao_reino: |
      Feche os olhos por um instante.
      A luz da manhã toca a clareira e o vento traz cheiro de terra viva.
    fala_portador:
      tom: misterioso
      script: |
        Hoje não buscamos um segredo distante.
        Buscamos um segredo pequeno, capaz de caber na palma da mão.
    card_guardiao: "CARD: CELESTE"
    abertura_sensorial: |
      O chão está morno, a grama se move devagar e um brilho laranja cruza entre os troncos.
      Uma presença leve se aproxima, como quem já conhece o caminho da descoberta.

  jornada:
    narrativa_principal:
      - titulo: O Primeiro Tesouro
        local: clareira_perguntas
        fala_guardiao:
          tom: acolhedor
          script: |
            "Encontrei a primeira semente."
            "[Celeste aproxima a pata e espera em silêncio.]"
            "Conte comigo: um."
        instrucao_portador: |
          Entregue uma semente na palma da criança.
          Nomeie com voz baixa e clara: "Um."
      - titulo: O Segundo Tesouro
        local: clareira_perguntas
        fala_guardiao:
          tom: curioso
          script: |
            "Há mais uma escondida na relva."
            "[Celeste inclina a cabeça e observa.]"
            "Agora temos um... e mais um."
        instrucao_portador: |
          Adicione a segunda semente ao lado da primeira.
          Convide a tocar uma por uma: "Um, dois."
      - titulo: A Terceira Promessa
        local: clareira_perguntas
        fala_guardiao:
          tom: maravilhado
          script: |
            "A terceira chegou para completar o desenho."
            "[Celeste sorri, como quem reconhece algo antigo.]"
            "Um, dois, três."
        instrucao_portador: |
          Entregue a terceira semente e reconte com ritmo calmo.
          Deixe a criança segurar as três por alguns segundos.

    concreto:
      desc: Contagem tátil 1-3 com correspondência um-a-um.
      card_objeto: "CARD: SEMENTES"
      metodo: mao-na-mao
      instrucoes_portador:
        - passo: 1
          acao: Coloque uma semente na mão da criança.
          fala_sugerida: "Um tesouro."
        - passo: 2
          acao: Acrescente a segunda e toque cada uma na ordem.
          fala_sugerida: "Um, dois."
        - passo: 3
          acao: Acrescente a terceira e reconte sem pressa.
          fala_sugerida: "Um, dois, três."
        - passo: 4
          acao: Guarde e retire do cesto, repetindo a contagem.
          fala_sugerida: "Guardamos três, voltamos com três."
      norte_absoluto: Tocar, mover e contar são o coração da aprendizagem nesta lição.
      adaptacao_bernardo: |
        Use objetos maiores, com textura mais marcada.
        Se necessário, aceite resposta por olhar, apontar ou vocalização breve.

    pictorico:
      status: VETADO
      motivo: "Em Sementes, o concreto lidera. A imagem vem depois da experiência."
      excecao: "Se Quiser Voar"

    abstrato:
      desc: Nomear 1, 2 e 3 após a vivência concreta.
      nota: Traçar no ar pode ser usado como extensão enativa, nunca como núcleo.

    extensao:
      titulo: Se Quiser Voar
      desc: Repetições curtas no cotidiano.
      sugestoes:
        - titulo: Três Coisas da Casa
          acao: Separar 3 objetos da mesma família (3 colheres, 3 tampas).
        - titulo: Três Passos
          acao: Caminhar 3 passos juntos e pausar para reconto.
      adaptacao_bernardo: |
        Faça ciclos menores e frequentes (1-2 minutos) ao longo do dia.
        Repita com menos estímulo visual no ambiente.

  narracao:
    instrucao_portador: |
      Após guardar os materiais, convide a criança a contar o que aconteceu.
      Escute sem corrigir frase por frase.
    pergunta_principal: Como Celeste encontrou os três tesouros?
    perguntas_coracao:
      - Qual semente apareceu primeiro?
      - O que mudou quando chegou a terceira?
    nota_cm: Narração breve consolida atenção e autoria da criança sobre a descoberta.

  ritual_fechamento:
    fala_guardiao:
      tom: grato
      script: |
        "Hoje você contou com mãos atentas."
        "Os três tesouros agora fazem parte da sua jornada."
    fio_ouro: Amanhã Bernardo pedirá ajuda para organizar pedras e transformar contagem em construção.
    transicao_volta:
      instrucao: Guardem os três objetos em silêncio curto e respirem juntos.
      fala: O Reino descansa, e o aprendizado permanece.

  sementes_do_dia:
    titulo: Sementes para o Dia
    instrucao: |
      Escolha uma ou duas propostas leves. A meta é continuidade viva, não carga extra.
    atividades:
      - titulo: Caça dos Três
        icone: ph-magnifying-glass
        acao: Encontrar 3 elementos parecidos em um cômodo da casa.
        tipo: Exploração
        com_irmaos: true
      - titulo: Passos da Raposa
        icone: ph-mask-happy
        acao: Brincar de dar 3 passos silenciosos como Celeste.
        tipo: Dramatização
        com_irmaos: true
      - titulo: Três Marcas
        icone: ph-pencil-simple
        acao: Fazer 3 marcas no papel, areia ou vapor do vidro.
        tipo: Criação
        com_irmaos: false
      - titulo: Reconto para Alguém
        icone: ph-chat-circle
        acao: Narrar para outra pessoa como foi contar até 3.
        tipo: Narração
        com_irmaos: false
      - titulo: Três Gratidões
        icone: ph-moon-stars
        acao: Antes de dormir, agradecer por 3 coisas do dia.
        tipo: Ritual Noturno
        com_irmaos: true
    frase_final: |
      Pequenas repetições concretas tornam a contagem estável e serena.

  para_familia:
    titulo: Entendendo a Jornada de Hoje
    porque_importa: |
      Esta lição inaugura a base numérica com experiência concreta.
      O objetivo não é decorar a sequência, mas perceber quantidade com sentido.
      A criança aprende quando coordena mão, voz e atenção.
    metodo_cpa:
      concreto: Manipulação real de três objetos, com contagem tocada.
      pictorico: Vetado no núcleo da lição.
      abstrato: Nomeação posterior de 1, 2 e 3.
      nota: "CM: Things before signs."
    principio_cm:
      numero: 10
      citacao: "Ideas are conveyed through living books and firsthand experiences."
      citacao_pt: "Ideias são transmitidas por experiências vivas e diretas."
      aplicacao: A palma da mão funciona como laboratório vivo para o conceito de número.
    tgtb_conexao: |
      Corresponde a 000-L1 (Numbers 1 to 3), preservando foco em reconhecimento inicial.
    espiral:
      conceito: Contagem inicial
      volta_atual: "Sementes - correspondência um-a-um até 3"
      proxima_volta: "Raízes - ampliação de contagem e relações operatórias"
      nota: A precisão futura depende da qualidade desta fundação concreta.
    reflexao_espiritual: |
      Pequenas quantidades ensinam atenção ao detalhe.
      O coração que aprende a contar também aprende a agradecer.
    nota_graca: |
      Se hoje houve distração, mantenha a paz.
      Consistência gentil vale mais que desempenho imediato.

  diario_portador:
    nota: Registrar percepção do ritmo da criança ajuda na calibragem das próximas lições.
    perguntas:
      - A criança tocou cada objeto ao contar?
      - Houve tranquilidade ou pressa no processo?
      - Qual adaptação funcionou melhor hoje?

  auditoria_qa:
    cm: [true, true, true, true, true]
    cpa: [true, true, true]
    narrativa: [true, true, true, true]
    template: [true, true, true]
    triade: [true, true, true]
    inclusao: [true, true]
