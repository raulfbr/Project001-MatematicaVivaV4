# LIÇÃO 002 - AS PEDRAS DA FORTALEZA
# Template: V6.5 | 04/03/2026 | Status: REVISAO_NARRATIVA_PREMIUM

_meta:
  id: licao-002-pedras-fortaleza
  versao: "6.5"
  fase: Sementes
  status: revisado

licao:
  metadados:
    id: MV-S-002
    titulo: As Pedras da Fortaleza
    fase: Sementes
    ciclo: K
    trimestre: 1
    estacao: 1
    tipo: Senso Numérico
    guardiao_lider: bernardo
    guardiao_secundario: iris
    guardioes_apresentados: [bernardo]
    tgtb_ref: 000-L2
    tgtb_titulo_en: Ten Frames
    tgtb_titulo_pt: Quadros de Dez
    objetivo_pedagogico: Organizar 5 objetos em fileira para introduzir estrutura visual de quantidade.
    tempo_licao: "15-20 min"
    tempo_preparo: "≤ 5 min"
    versao: "6.5"
    status: revisado

  navegacao:
    anterior:
      id: MV-S-001
      titulo: A Trindade na Palma
    proxima:
      id: MV-S-003
      titulo: A Estrela do Reino

  para_portador:
    ideia_viva:
      frase: "Pedras soltas viram fortaleza quando encontram ordem."
      conceito: Organizar em fileira ajuda a enxergar quantidade com clareza.
      intencao_cm: A matemática aparece como ato de construção, não como recitação vazia.
    dica_coracao: |
      Bernardo ensina firmeza gentil.
      Hoje o foco é organizar com calma, conferir e recomeçar sem drama.
      A criança aprende tanto com o acerto quanto com o ajuste.
    filho_descobre: |
      Que cinco elementos podem ser vistos como um conjunto organizado.
      Que ordem visual facilita contagem e compreensão.
    protocolo_impecabilidade: |
      Convide para conferir, em vez de corrigir de forma brusca.
      Use a frase: "Vamos revisar juntos como construtores."
    nota_graca: |
      Se a fileira desmontar, tudo bem.
      Recomeçar faz parte do ofício de quem constrói.
    conforto_emocional: |
      Perseverança calma forma caráter e pensamento matemático ao mesmo tempo.
    audio_script: |
      Portador, hoje a Caverna do Recomeço recebe vocês.
      Levem cinco pedras e um coração paciente.
    preparacao:
      materiais:
        - item: "5 pedrinhas, blocos ou tampas"
          qtd: 5
          alt: "5 sementes maiores"
          essencial: true
          nota: "Objetos de tamanho similar ajudam a comparação visual."
        - item: "Card Bernardo"
          qtd: 1
          alt: "Imagem da guardiã"
          essencial: true
          nota: "Opcional para famílias sem card."
        - item: "Fita, barbante ou linha-guia"
          qtd: 1
          alt: "Traço no papel"
          essencial: false
          nota: "Facilita alinhamento para iniciantes."

  linkage:
    elo_anterior:
      licao_id: MV-S-001
      gancho: Depois de contar até 3 com Celeste, agora organizamos o 5 com Bernardo.
    proximo:
      licao_id: MV-S-003
      gancho: A organização do 5 prepara o olhar para a forma da estrela na próxima lição.

  ritual_abertura:
    instrucao_ambiente: Espaço curto no chão, cinco objetos à vista e clima sem pressa.
    local: caverna_recomeco
    clima: crepusculo
    virtude: persistencia
    artefato: Pedras da fortaleza
    transicao_reino: |
      Feche os olhos por um instante.
      O ar esfria um pouco, e o som de pedra sobre pedra marca o ritmo da caverna.
    fala_portador:
      tom: solene
      script: |
        Hoje veremos como a ordem transforma esforço em construção.
        Bernardo espera por mãos pequenas e atenção fiel.
    card_guardiao: "CARD: BERNARDO"
    abertura_sensorial: |
      Cheiro de terra, madeira e brasa baixa.
      A luz entra em faixas pela entrada da caverna, iluminando um chão de pedras.
      Uma voz firme, porém tranquila, convida ao trabalho conjunto.

  jornada:
    narrativa_principal:
      - titulo: O Chamado do Construtor
        local: caverna_recomeco
        fala_guardiao:
          tom: firme
          script: |
            "Tenho pedras suficientes, mas ainda sem ordem."
            "[Bernardo aponta para o chão com calma.]"
            "Vamos formar uma fileira e conferir juntos."
        instrucao_portador: |
          Espalhe os 5 objetos sem sequência.
          Convide: "Vamos ajudar Bernardo a organizar."
      - titulo: Pedra por Pedra
        local: caverna_recomeco
        fala_guardiao:
          tom: encorajador
          script: |
            "Uma pedra abre o caminho."
            "A segunda se coloca ao lado."
            "Seguimos até a fileira ficar completa."
        instrucao_portador: |
          Posicione com a criança uma pedra por vez, em linha.
          Nomeie cada posição durante o movimento.
      - titulo: Muro em Ordem
        local: caverna_recomeco
        fala_guardiao:
          tom: satisfeito
          script: |
            "Agora vemos o conjunto inteiro."
            "[Bernardo passa a pata acima da linha, sem tocar.]"
            "Conte comigo de novo: um, dois, três, quatro, cinco."
        instrucao_portador: |
          Reconte tocando cada peça.
          Se houver erro, reorganize e reconte sem pressa.

    concreto:
      desc: Organização de 5 objetos em fileira para percepção visual de quantidade.
      card_objeto: "CARD: PEDRAS"
      metodo: mao-na-mao
      instrucoes_portador:
        - passo: 1
          acao: Coloque os 5 objetos espalhados.
          fala_sugerida: "Temos material. Falta ordem."
        - passo: 2
          acao: Posicione a primeira peça na linha.
          fala_sugerida: "Começamos pelo um."
        - passo: 3
          acao: Complete a fileira até a quinta peça.
          fala_sugerida: "Seguimos juntos até cinco."
        - passo: 4
          acao: Passe o dedo e reconte a fileira.
          fala_sugerida: "Conferir também é construir."
        - passo: 5
          acao: Misture e repita uma segunda rodada curta.
          fala_sugerida: "Recomeçar fortalece."
      norte_absoluto: O valor pedagógico está no ciclo organizar-contar-conferir.
      adaptacao_bernardo: |
        Use peças maiores e com contraste de cor.
        Se necessário, use trilha guia (fita) para reduzir carga motora.

    pictorico:
      status: VETADO
      motivo: "Sementes prioriza manipulação concreta antes de qualquer representação."
      excecao: "Se Quiser Voar"

    abstrato:
      desc: Nomear o conjunto de cinco após organizar e contar.
      nota: Reconhecimento visual do numeral pode aparecer apenas no fechamento.

    extensao:
      titulo: Se Quiser Voar
      desc: Reforços rápidos de organização no cotidiano.
      sugestoes:
        - titulo: Prateleira em Ordem
          acao: Alinhar 5 livros ou brinquedos em fileira.
        - titulo: Muro de Almofadas
          acao: Montar e reconferir uma linha de 5 almofadas.
      adaptacao_bernardo: |
        Reduza para 3 peças se houver fadiga e aumente progressivamente.
        Mantenha sempre a lógica de sequência visual.

  narracao:
    instrucao_portador: |
      Convide a criança a recontar como a fileira foi montada.
      Escute a lógica que ela usa para explicar.
    pergunta_principal: Como você ajudou Bernardo a colocar tudo em ordem?
    perguntas_coracao:
      - O que mudou quando as pedras saíram do espalhado para a fileira?
      - Qual parte foi mais fácil: montar ou conferir?
    nota_cm: Narração torna visível o raciocínio da criança sobre ordem e quantidade.

  ritual_fechamento:
    fala_guardiao:
      tom: grato
      script: |
        "Seu olhar de construtor ficou mais forte hoje."
        "Onde há ordem, o trabalho ganha paz."
    fio_ouro: Amanhã, Íris mostrará como o cinco também aparece em forma e beleza.
    transicao_volta:
      instrucao: Guardem as cinco peças em sequência, uma por uma.
      fala: A fortaleza repousa, a atenção permanece.

  sementes_do_dia:
    titulo: Sementes para o Dia
    instrucao: |
      Escolha micropráticas de organização com cinco elementos para consolidar sem sobrecarga.
    atividades:
      - titulo: Caça às Fileiras
        icone: ph-magnifying-glass
        acao: Encontrar fileiras naturais em casa (livros, talheres, azulejos).
        tipo: Exploração
        com_irmaos: true
      - titulo: Oficina do Urso
        icone: ph-mask-happy
        acao: Dramatizar Bernardo organizando 5 objetos com voz de personagem.
        tipo: Dramatização
        com_irmaos: true
      - titulo: Trilha de Cinco
        icone: ph-pencil-simple
        acao: Marcar uma linha e posicionar 5 pontos ou peças sobre ela.
        tipo: Criação
        com_irmaos: false
      - titulo: Relato do Construtor
        icone: ph-chat-circle
        acao: A criança conta para alguém como conferiu a fileira.
        tipo: Narração
        com_irmaos: false
      - titulo: Ordem da Noite
        icone: ph-moon-stars
        acao: Antes de dormir, alinhar 5 objetos pequenos e recontar.
        tipo: Ritual Noturno
        com_irmaos: true
    frase_final: |
      Repetições curtas de organização fortalecem atenção e preparam a base do ten frame.

  para_familia:
    titulo: Entendendo a Jornada de Hoje
    porque_importa: |
      O foco da lição é estrutura visual de quantidade.
      A criança deixa de ver cinco objetos apenas como itens soltos e passa a percebê-los como conjunto.
      Esse movimento sustenta cálculo mental futuro.
    metodo_cpa:
      concreto: Fileira física de 5 objetos com reconto.
      pictorico: Vetado no núcleo.
      abstrato: Nomeação posterior do conjunto de cinco.
      nota: "CM: Things before signs."
    principio_cm:
      numero: 16
      citacao: "Handicrafts teach children precision and patience."
      citacao_pt: "Trabalhos manuais treinam precisão e paciência."
      aplicacao: Organizar peças em sequência é trabalho manual que forma atenção matemática.
    tgtb_conexao: |
      Alinhada a 000-L2 (Ten Frames), introduzindo a lógica de organização visual.
    espiral:
      conceito: Estruturação do cinco
      volta_atual: "Sementes - fileira concreta e reconto"
      proxima_volta: "Raízes - ten frame completo e leitura rápida de padrões"
      nota: Sem estrutura visual, a contagem tende a ficar frágil e cansativa.
    reflexao_espiritual: |
      Ordem não é rigidez; é serviço ao que é bom e compreensível.
      O cuidado com pequenas estruturas prepara o coração para tarefas maiores.
    nota_graca: |
      Se a criança cansar, reduza a rodada.
      A consistência gentil produz mais fruto que sessões longas.

  diario_portador:
    nota: Observar como a criança organiza revela seu estágio real de compreensão.
    perguntas:
      - Ela consegue manter sequência sem pular peças?
      - Ela percebe quando uma peça saiu da linha?
      - O reconto ajudou a estabilizar a resposta?

  auditoria_qa:
    cm: [true, true, true, true, true]
    cpa: [true, true, true]
    narrativa: [true, true, true, true]
    template: [true, true, true]
    triade: [true, true, true]
    inclusao: [true, true]
