licao:
  metadados:
    id: MV-S-003
    titulo: A Estrela do Reino
    fase: Sementes
    ciclo: K
    trimestre: 1
    estacao: 1
    tipo: Senso Numérico e Geometria Inicial
    guardiao_lider: iris
    guardiao_secundario: bernardo
    guardioes_apresentados: [iris]
    tgtb_ref: 000-L3
    tgtb_titulo_en: Numbers 4 and 5
    tgtb_titulo_pt: Números 4 e 5
    objetivo_pedagogico: Explorar 4 e 5 por composição visual (4 ao redor + 1 no centro).
    tempo_licao: "15-20 min"
    tempo_preparo: "≤ 5 min"
    versao: "6.5"
    status: revisado

  navegacao:
    anterior:
      id: MV-S-002
      titulo: As Pedras da Fortaleza
    proxima:
      id: MV-S-004
      titulo: A Ordem do Dia

  para_portador:
    ideia_viva:
      frase: "Quatro guardam as bordas, e o quinto acende o centro."
      conceito: O cinco pode ser percebido como estrutura, não apenas como sequência.
      intencao_cm: A criança contempla forma e quantidade juntas, por experiência viva.
    dica_coracao: |
      Hoje a matemática aparece como desenho no espaço.
      Íris convida para um olhar de detalhe: posição também ensina número.
      Menos explicação, mais observação guiada.
    filho_descobre: |
      Que quatro elementos podem cercar um centro.
      Que ao adicionar um elemento central, surge uma nova unidade visual: cinco.
    protocolo_impecabilidade: |
      Mantenha ritmo calmo e visual limpo.
      Nomeie as posições com simplicidade: ao redor, centro, conjunto.
    nota_graca: |
      Se a forma ficar irregular, não corrija com rigidez.
      Reorganizar faz parte da descoberta geométrica.
    conforto_emocional: |
      A estética da lição não exige perfeição.
      A beleza nasce quando a criança participa do arranjo.
    audio_script: |
      Portador, hoje o Ninho Mirante se torna ateliê.
      Vamos ver o cinco nascer diante dos olhos.
    preparacao:
      materiais:
        - item: "5 pedrinhas ou botões"
          qtd: 5
          alt: "5 sementes maiores"
          essencial: true
          nota: "Ideal se forem semelhantes em tamanho."
        - item: "1 maçã"
          qtd: 1
          alt: "Imagem da seção de maçã"
          essencial: false
          nota: "Usar apenas se houver segurança no manuseio por adulto."
        - item: "Card Íris"
          qtd: 1
          alt: "Imagem da guardiã"
          essencial: true
          nota: "Opcional para famílias sem card."

  linkage:
    elo_anterior:
      licao_id: MV-S-002
      gancho: A fileira de Bernardo treinou ordem; agora Íris mostra forma e composição.
    proximo:
      licao_id: MV-S-004
      gancho: Depois de ver estrutura no espaço, Noé ensinará estrutura no tempo e sequência.

  ritual_abertura:
    instrucao_ambiente: Separe os 5 objetos em uma bandeja clara e mantenha superfície livre.
    local: ninho_mirante
    clima: primaveril
    virtude: atencao
    artefato: Flor de cinco partes
    transicao_reino: |
      Feche os olhos e suba, devagar, ao galho mais alto.
      O vento leve passa pelo rosto e o Reino inteiro se abre lá embaixo.
    fala_portador:
      tom: delicado
      script: |
        Hoje não vamos correr atrás de quantidade.
        Vamos permitir que a forma nos mostre a quantidade por dentro.
    card_guardiao: "CARD: IRIS"
    abertura_sensorial: |
      O ar está claro, com cheiro de folhas novas.
      No ninho, tudo parece simples: cinco peças pequenas e um espaço no centro.
      Uma voz leve convida a olhar de perto.

  jornada:
    narrativa_principal:
      - titulo: A Moldura de Quatro
        local: ninho_mirante
        fala_guardiao:
          tom: curioso
          script: |
            "Vamos desenhar um contorno com quatro pedras."
            "[Íris toca o ar em quatro pontos.]"
            "Veja: uma, duas, três, quatro."
        instrucao_portador: |
          Posicione 4 peças em volta de um espaço vazio.
          Conte com a criança, uma a uma.
      - titulo: O Centro que Completa
        local: ninho_mirante
        fala_guardiao:
          tom: poetico
          script: |
            "Agora falta o coração da forma."
            "[Íris aponta para o meio vazio.]"
            "Quando o centro chega, o desenho respira."
        instrucao_portador: |
          Coloque a quinta peça no centro.
          Reconte o conjunto completo.
      - titulo: A Estrela Revelada
        local: ninho_mirante
        fala_guardiao:
          tom: maravilhado
          script: |
            "Quatro guardam as bordas; um ilumina o meio."
            "Assim o cinco aparece aos olhos."
        instrucao_portador: |
          Opcional adulto: mostrar seção transversal da maçã para observar forma estrelada.
          Relacione com o arranjo feito no chão/mesa.

    concreto:
      desc: Compor o 5 por arranjo espacial (4 ao redor + 1 no centro).
      card_objeto: "CARD: ESTRELA DE PEDRAS"
      metodo: mao-na-mao
      instrucoes_portador:
        - passo: 1
          acao: Coloque 4 peças ao redor, deixando centro livre.
          fala_sugerida: "Temos quatro ao redor."
        - passo: 2
          acao: Conte as quatro posições externas.
          fala_sugerida: "Uma, duas, três, quatro."
        - passo: 3
          acao: Adicione a quinta peça no centro.
          fala_sugerida: "Chegou o centro: agora temos cinco."
        - passo: 4
          acao: Reorganize e repita a composição.
          fala_sugerida: "Vamos montar de novo para confirmar."
        - passo: 5
          acao: "Opcional adulto: corte transversal de maçã e mostre o desenho interno."
          fala_sugerida: "A natureza também desenha o cinco."
      norte_absoluto: O foco é perceber estrutura e quantidade simultaneamente no concreto.
      adaptacao_bernardo: |
        Use base com marcações leves para orientar posições.
        Se necessário, trabalhe só com "quatro ao redor" no primeiro ciclo.

    pictorico:
      status: VETADO
      motivo: "A forma nasce de objetos reais antes de virar desenho."
      excecao: "Se Quiser Voar"

    abstrato:
      desc: Nomear 4 e 5 a partir da composição vivida.
      nota: Traço no ar pode aparecer apenas após a montagem concreta.

    extensao:
      titulo: Se Quiser Voar
      desc: Expandir a percepção de forma no cotidiano.
      nota_irmaos: |
        Irmãos podem alternar papéis: um monta, outro verifica e narra.
      sugestoes:
        - titulo: Caça ao Centro
          acao: Procurar objetos com "centro e borda" pela casa.
          com_irmaos: true
        - titulo: Jardins de Cinco
          acao: Montar novos arranjos de 5 peças com centro visível.
          com_irmaos: true
      adaptacao_bernardo: |
        Reduza para sessões curtas e repita no mesmo dia em microblocos.

  narracao:
    instrucao_portador: |
      Convide a criança a explicar como o cinco apareceu.
      Valorize a descrição dela, mesmo que incompleta.
    pergunta_principal: Como o cinco nasceu da forma hoje?
    perguntas_coracao:
      - O que mudou quando colocamos a peça do centro?
      - O quatro e o cinco pareceram diferentes no seu olhar?
    nota_cm: "Narração aqui treina linguagem relacional: borda, centro, conjunto."

  ritual_fechamento:
    fala_guardiao:
      tom: grato
      script: |
        "Seu olhar viu mais do que peças."
        "Você viu um desenho ganhar sentido."
    fio_ouro: Amanhã Noé mostrará que ordem também organiza o tempo e os acontecimentos.
    transicao_volta:
      instrucao: Guardem as cinco peças na ordem que preferirem e respirem juntos.
      fala: O ninho silencia, e a forma permanece na memória.

  sementes_do_dia:
    titulo: Sementes para o Dia
    instrucao: |
      Reforce a ideia de centro e borda em situações simples do cotidiano.
    atividades:
      - titulo: Caça dos Cincos
        icone: ph-magnifying-glass
        acao: Procurar coisas que remetam ao cinco (dedos, pétalas, marcas).
        tipo: Exploração
        com_irmaos: true
      - titulo: Teatro da Íris
        icone: ph-mask-happy
        acao: Dramatizar Íris revelando uma forma escondida no ambiente.
        tipo: Dramatização
        com_irmaos: true
      - titulo: Mandala de Cinco
        icone: ph-pencil-simple
        acao: Criar um desenho simples com quatro pontos externos e um central.
        tipo: Criação
        com_irmaos: false
      - titulo: Reconto da Estrela
        icone: ph-chat-circle
        acao: A criança conta para alguém como montou o cinco por composição.
        tipo: Narração
        com_irmaos: false
      - titulo: Silêncio e Centro
        icone: ph-moon-stars
        acao: Antes de dormir, lembrar "o que foi centro no meu dia hoje?".
        tipo: Ritual Noturno
        com_irmaos: true
    frase_final: |
      Quando a criança percebe estrutura no concreto, aprende matemática com beleza e sentido.

  para_familia:
    titulo: Entendendo a Jornada de Hoje
    porque_importa: |
      Esta lição amplia a noção de número por composição visual.
      A criança percebe que cinco não é só "depois do quatro", mas também uma estrutura organizada.
      Isso prepara leitura de padrões e pensamento matemático mais flexível.
    metodo_cpa:
      concreto: Arranjo físico de 4 ao redor e 1 no centro.
      pictorico: Vetado no núcleo.
      abstrato: Nomeação posterior de 4 e 5 pela estrutura.
      nota: "CM: Mind feeds on living ideas; forma e número caminham juntos."
    principio_cm:
      numero: 6
      citacao: "Education is the science of relations."
      citacao_pt: "Educação é a ciência das relações."
      aplicacao: A criança aprende relação entre posição e quantidade.
    tgtb_conexao: |
      Alinhada a 000-L3 (Numbers 4 and 5), com ênfase em percepção estrutural.
    espiral:
      conceito: Composição do cinco
      volta_atual: "Sementes - forma concreta com centro e borda"
      proxima_volta: "Raízes - decomposição e composição numérica mais formal"
      nota: Percepção estrutural precoce facilita adição e subtração futuras.
    reflexao_espiritual: |
      Há beleza quando partes diferentes encontram unidade.
      Esta percepção de ordem também educa sensibilidade e contemplação.
    nota_graca: |
      Se o arranjo não sair como esperado, reduza complexidade e reconstrua.
      Clareza cresce com repetição breve e alegre.

  diario_portador:
    nota: Registrar como a criança descreve forma ajuda a acompanhar maturação matemática.
    perguntas:
      - Ela percebeu diferença entre "ao redor" e "no centro"?
      - Conseguiu recontar 4 + 1 como cinco?
      - Precisou de apoio visual adicional?

  auditoria_qa:
    cm: [true, true, true, true, true]
    cpa: [true, true, true]
    narrativa: [true, true, true, true]
    template: [true, true, true]
    triade: [true, true, true]
    inclusao: [true, true]
