# LIÇÃO 009 - O CELEIRO DE NOÉ
# Template: V6.5 | 04/03/2026 | Status: REVISAO_YAML_FIRST

_meta:
  id: licao-009-celeiro-noe
  versao: "6.5"
  fase: Sementes
  status: revisado

licao:
  metadados:
    id: MV-S-009
    titulo: O Celeiro de Noé
    fase: Sementes
    ciclo: K
    trimestre: 1
    estacao: 1
    tipo: Senso Numérico
    guardiao_lider: noe
    guardiao_secundario: bernardo
    guardioes_apresentados: [noe]
    tgtb_ref: 000-L9
    tgtb_titulo_en: Numbers 8 to 9
    tgtb_titulo_pt: Números 8 e 9
    objetivo_pedagogico: Contar quantidades até 9 com foco em 8 e 9.
    tempo_licao: "15-20 min"
    tempo_preparo: "≤ 5 min"
    versao: "6.5"
    status: revisado

  navegacao:
    anterior:
      id: MV-S-008
      titulo: O Par Perfeito
    proxima:
      id: MV-S-010
      titulo: A Fila da Providência

  para_portador:
    ideia_viva:
      frase: "Oito fardos de esperança guardados para a chuva, e mais um para amanhã."
      conceito: Mesmo quantidades maiores continuam acessíveis quando contamos com ritmo.
      intencao_cm: A criança treina atenção sustentada por meio de uma contagem calma e concreta.
    dica_coracao: |
      Hoje o ritmo vale mais do que a pressa.
      Noé nos ensina a contar tocando cada objeto com presença.
      Pausas curtas fazem parte da pedagogia.
    filho_descobre: Oito e nove são quantidades grandes, mas possíveis de contar com método.
    protocolo_impecabilidade: |
      Conte devagar e aponte um objeto por vez.
      Se houver confusão, reinicie sem tensão e sem corrigir com pressa.
    nota_graca: |
      Se a contagem quebrar no meio, respire e recomece.
      Noé diz: "O número continua aqui, esperando por nós."
    conforto_emocional: |
      Esta lição fortalece atenção e confiança.
      O acerto nasce da calma repetida.
    audio_script: |
      Portador, o celeiro está aberto.
      Hoje vamos contar provisões com Noé, no tempo certo.
    preparacao:
      materiais:
        - item: "9 objetos pequenos (pedras, blocos ou sementes grandes)"
          qtd: 9
          alt: "9 tampas de garrafa"
          essencial: true
          nota: "Use objetos fáceis de tocar e mover."
        - item: "Card Noé"
          qtd: 1
          alt: "Imagem da guardiã coruja"
          essencial: true
          nota: "Opcional para famílias sem card."
        - item: "Cartões 8 e 9"
          qtd: 2
          alt: "Números escritos em papel"
          essencial: false
          nota: "Aparecem apenas depois da contagem concreta."

  linkage:
    elo_anterior:
      licao_id: MV-S-008
      gancho: O olhar treinado em pares agora sustenta uma contagem mais longa.
    proximo:
      licao_id: MV-S-010
      gancho: Depois de contar até 9, avançamos para posição na fila com Celeste.

  ritual_abertura:
    instrucao_ambiente: Organize os 9 objetos em um cesto, com ambiente calmo e sem ruído excessivo.
    local: arvore_silencio
    clima: crepusculo
    virtude: paciencia
    artefato: Cesto com nove fardos simbólicos
    transicao_reino: |
      Feche os olhos por um instante.
      O ar está fresco e o caminho leva à Árvore do Silêncio.
    fala_portador:
      tom: solene
      script: |
        Hoje vamos entrar no celeiro de Noé.
        Aqui, cada número é contado com reverência e paciência.
    card_guardiao: "CARD: NOE"
    abertura_sensorial: |
      Cheiro de madeira e folhas secas.
      A luz do fim da tarde toca os objetos alinhados no chão.
      Uma voz serena convida: "Conte comigo, sem pressa."

  jornada:
    narrativa_principal:
      - titulo: Provisões Guardadas
        local: arvore_silencio
        fala_guardiao:
          tom: acolhedor
          script: |
            "Separei estes fardos para tempos de chuva."
            "[Noé aproxima uma asa do primeiro objeto.]"
            "Vamos contar juntos, um por vez."
        instrucao_portador: |
          Coloque os 9 objetos em linha ou semicírculo.
          Convide a criança a tocar cada peça enquanto conta.
      - titulo: Oito Fardos de Esperança
        local: arvore_silencio
        fala_guardiao:
          tom: paciente
          script: |
            "Um... dois... três..."
            "[Noé mantém pausas curtas entre cada número.]"
            "...sete, oito. Oito fardos de esperança."
        instrucao_portador: |
          Conte até 8 com ritmo lento.
          Pare no 8 e valorize: "Chegamos ao oito."
      - titulo: Nove, o Último Antes do Dez
        local: arvore_silencio
        fala_guardiao:
          tom: satisfeito
          script: |
            "Agora acrescentamos mais um."
            "Nove. O último passo antes da dezena."
        instrucao_portador: |
          Acrescente o 9º objeto de forma visível.
          Diga: "Oito e mais um formam nove."

    concreto:
      desc: Contagem concreta de objetos até 9, com ênfase em 8 e 9.
      card_objeto: "CARD: FARDOS DO CELEIRO"
      metodo: mao-na-mao
      instrucoes_portador:
        - passo: 1
          acao: Disponha 9 objetos em linha.
          fala_sugerida: "Vamos tocar cada um para não pular nenhum."
        - passo: 2
          acao: Conte até 8 com apontamento sincronizado.
          fala_sugerida: "Oito fardos já foram contados."
        - passo: 3
          acao: Adicione o nono e reconte do 1 ao 9.
          fala_sugerida: "Agora temos nove."
        - passo: 4
          acao: Misture e peça nova contagem para confirmar.
          fala_sugerida: "Vamos verificar de novo, com calma."
      norte_absoluto: Contar tocando cada elemento evita saltos e ancora o sentido de quantidade.
      adaptacao_bernardo: |
        Trabalhe em dois blocos (5 e depois 3, depois mais 1) se necessário.
        Se houver fadiga, mantenha só até 8 hoje e retome 9 amanhã.

    pictorico:
      status: VETADO
      motivo: "Sementes prioriza manipulação real antes de representação gráfica."
      excecao: "Se Quiser Voar"

    abstrato:
      desc: Reconhecer os símbolos 8 e 9 após contar os objetos.
      nota: O numeral é apresentado no final como nome visual do que já foi vivido.

    extensao:
      titulo: Se Quiser Voar
      desc: Repetições breves de contagem no cotidiano.
      sugestoes:
        - titulo: Passos do Corredor
          acao: Caminhe 8 passos, pause, e adicione mais 1 para chegar a 9.
        - titulo: Duas Mãos e Quase
          acao: Mostre 10 dedos e dobre 1 para visualizar 9.
      adaptacao_bernardo: |
        Use objetos de textura diferente para reforçar percepção tátil.
        Reduza distrações visuais no ambiente.

  narracao:
    instrucao_portador: |
      Convide a criança a recontar como chegou ao 8 e depois ao 9.
      Escute sem interromper.
    pergunta_principal: Como você descobriu o 9 hoje?
    perguntas_coracao:
      - Em qual número você precisou de mais atenção?
      - O que mudou quando contamos devagar?
    nota_cm: Narração curta transforma contagem em compreensão, não só repetição.

  ritual_fechamento:
    fala_guardiao:
      tom: grato
      script: |
        "Você contou com paciência e firmeza."
        "O celeiro está pronto, e seu olhar também."
    fio_ouro: Amanhã Celeste mostrará que, além de contar, também podemos ordenar posições na fila.
    transicao_volta:
      instrucao: Guarde os objetos no cesto enquanto repete 1 a 9 em voz serena.
      fala: Contando com calma, voltamos para casa.

  sementes_do_dia:
    titulo: Sementes para o Dia
    instrucao: |
      Use micropráticas de 1 a 3 minutos para consolidar 8 e 9 sem cansar a criança.
    atividades:
      - titulo: Contagem na Cozinha
        icone: ph-magnifying-glass
        acao: Conte 8 itens da cozinha e depois adicione 1 para formar 9.
        tipo: Exploração
        com_irmaos: true
      - titulo: Celeiro Encenado
        icone: ph-mask-happy
        acao: Monte um mini celeiro com brinquedos e dramatize a guarda dos fardos.
        tipo: Dramatização
        com_irmaos: true
      - titulo: Trilha do 9
        icone: ph-pencil-simple
        acao: Faça uma trilha com 9 marcas no chão para a criança percorrer contando.
        tipo: Criação
        com_irmaos: true
      - titulo: Relato do Contador
        icone: ph-chat-circle
        acao: A criança conta para alguém como chegou ao 8 e ao 9.
        tipo: Narração
        com_irmaos: false
      - titulo: Pergunta da Noite
        icone: ph-moon
        acao: "O que ajuda você a não pular números quando conta?"
        tipo: Ritual Noturno
        com_irmaos: true
    frase_final: |
      Repetições curtas e concretas transformam 8 e 9 em conhecimento estável.

  para_familia:
    titulo: Quase Dez
    porque_importa: |
      Os números 8 e 9 preparam o caminho para a dezena.
      Contar com apontamento e ritmo previne "contagem decorada" sem quantidade real.
      O objetivo é coordenação entre fala, olhar e toque.
    metodo_cpa:
      concreto: Objetos reais contados um a um.
      pictorico: Vetado na fase principal.
      abstrato: Identificar símbolos 8 e 9 após a vivência.
      nota: "CM: Lições curtas e brilhantes, com atenção treinada."
    principio_cm:
      numero: 17
      citacao: "Habit of attention should be trained."
      aplicacao: Pausas e ritmo lento treinam atenção sustentada.
    tgtb_conexao: |
      Alinhada a 000-L9 (Numbers 8 to 9), preservando foco em contagem concreta.
    espiral:
      conceito: Contagem até 9
      volta_atual: "Sementes - quantidade concreta com objetos"
      proxima_volta: "Raízes - operações iniciais e base para valor posicional"
      nota: O sentido de quantidade antecede qualquer algoritmo.
    reflexao_espiritual: |
      Esperar e contar no tempo certo também educa o coração.
      Paciência não atrasa a aprendizagem; ela a aprofunda.
    nota_graca: |
      Se houver tropeço, repita menos itens e celebre a consistência.
      A firmeza vale mais que a velocidade.

  diario_portador:
    nota: Observe se a criança coordena fala e apontamento sem pular objetos.
    perguntas:
      - Ela percebe a diferença entre 8 e 9 concretamente?
      - O ritmo calmo aumentou a precisão?

