# LIÇÃO 010 - A FILA DA PROVIDÊNCIA
# Template: V6.5 | 04/03/2026 | Status: REVISAO_YAML_FIRST

_meta:
  id: licao-010-fila-providencia
  versao: "6.5"
  fase: Sementes
  status: revisado

licao:
  metadados:
    id: MV-S-010
    titulo: A Fila da Providência
    fase: Sementes
    ciclo: K
    trimestre: 1
    estacao: 1
    tipo: Números Ordinais
    guardiao_lider: celeste
    guardiao_secundario: melquior
    guardioes_apresentados: [celeste]
    tgtb_ref: 000-L10
    tgtb_titulo_en: Ordinal Numbers Part 1
    tgtb_titulo_pt: Números Ordinais Parte 1
    objetivo_pedagogico: Compreender posições ordinais do primeiro ao quinto em fila concreta.
    tempo_licao: "15-20 min"
    tempo_preparo: "≤ 5 min"
    versao: "6.5"
    status: revisado

  navegacao:
    anterior:
      id: MV-S-009
      titulo: O Celeiro de Noé
    proxima:
      id: MV-S-011
      titulo: A Plenitude das Mãos

  para_portador:
    ideia_viva:
      frase: "Na fila da providência, cada lugar conta uma história."
      conceito: Ordinais descrevem posição (primeiro, segundo, terceiro...) e não quantidade total.
      intencao_cm: A criança aprende relações por meio de movimento e linguagem viva.
    dica_coracao: |
      Hoje o foco é ordem e posição.
      Celeste convida a criança a ver quem vem primeiro, quem vem depois e quem fecha a fila.
      Faça perguntas curtas e deixe ela responder com corpo e voz.
    filho_descobre: Podemos nomear lugares na fila do primeiro ao quinto.
    protocolo_impecabilidade: |
      Monte uma fila real com objetos e mantenha referência visual estável.
      Troque posições e pergunte novamente para consolidar.
    nota_graca: |
      Confundir "três" com "terceiro" é esperado no começo.
      Repita com tranquilidade, sem transformar em prova.
    conforto_emocional: |
      Ordinais são linguagem de relação.
      A compreensão amadurece em espiral, com pequenas repetições.
    audio_script: |
      Portador, Celeste preparou uma trilha de chegada.
      Hoje vamos descobrir quem ocupa cada lugar na fila.
    preparacao:
      materiais:
        - item: "5 objetos diferentes (bonecos, carrinhos ou blocos)"
          qtd: 5
          alt: "5 cartões com desenhos distintos"
          essencial: true
          nota: "Diferenças visuais ajudam a identificar posição."
        - item: "Card Celeste"
          qtd: 1
          alt: "Imagem da guardiã raposa"
          essencial: true
          nota: "Opcional para famílias sem card."

  linkage:
    elo_anterior:
      licao_id: MV-S-009
      gancho: Depois de contar até 9, agora organizamos posições na fila.
    proximo:
      licao_id: MV-S-011
      gancho: A noção de ordem prepara a criança para a plenitude do 10 e 11.

  ritual_abertura:
    instrucao_ambiente: Deixe espaço livre no chão para organizar uma fila de cinco objetos.
    local: clareira_perguntas
    clima: ensolarado
    virtude: curiosidade
    artefato: Linha de largada simbólica
    transicao_reino: |
      Feche os olhos por um instante.
      A clareira está iluminada e um caminho foi marcado na grama.
    fala_portador:
      tom: animado
      script: |
        Hoje a clareira recebe uma fila especial.
        Vamos descobrir quem chega primeiro e quem fecha o caminho.
    card_guardiao: "CARD: CELESTE"
    abertura_sensorial: |
      Cheiro de grama fresca e vento leve.
      Cinco pequenos corredores aguardam em silêncio.
      Uma voz alegre convida: "Observe a ordem, ela conta segredos."

  jornada:
    narrativa_principal:
      - titulo: A Linha de Partida
        local: clareira_perguntas
        fala_guardiao:
          tom: animado
          script: |
            "A fila está pronta."
            "[Celeste caminha ao lado dos cinco corredores.]"
            "Quem ocupa o primeiro lugar?"
        instrucao_portador: |
          Monte a fila com 5 objetos e nomeie apenas o primeiro e o último.
          Evite pressa para não confundir termos.
      - titulo: Nomeando Posições
        local: clareira_perguntas
        fala_guardiao:
          tom: curioso
          script: |
            "Depois do primeiro vem o segundo."
            "Depois, terceiro, quarto e quinto."
        instrucao_portador: |
          Aponte cada objeto em sequência e nomeie as posições.
          Convide a criança a repetir junto.
      - titulo: Troca de Lugares
        local: clareira_perguntas
        fala_guardiao:
          tom: satisfeito
          script: |
            "Se mudamos a ordem, mudam os lugares."
            "Vamos descobrir de novo quem é o terceiro?"
        instrucao_portador: |
          Troque dois objetos de posição.
          Faça perguntas variadas: primeiro, terceiro, quinto.

    concreto:
      desc: Organização de fila concreta para identificar ordinais do 1º ao 5º.
      card_objeto: "CARD: FILA DA CORRIDA"
      metodo: mao-na-mao
      instrucoes_portador:
        - passo: 1
          acao: Posicione 5 objetos em linha horizontal.
          fala_sugerida: "Vamos observar cada lugar desta fila."
        - passo: 2
          acao: Nomeie do primeiro ao quinto apontando objeto por objeto.
          fala_sugerida: "Primeiro, segundo, terceiro, quarto, quinto."
        - passo: 3
          acao: Pergunte posições específicas e aguarde resposta.
          fala_sugerida: "Quem está em terceiro?"
        - passo: 4
          acao: Troque dois objetos e repita as perguntas.
          fala_sugerida: "Mudou a posição. Vamos descobrir de novo."
      norte_absoluto: Ordinal é posição na sequência; o objeto pode mudar, o lugar também muda.
      adaptacao_bernardo: |
        Comece com 3 posições (primeiro, segundo, terceiro) e avance para 5.
        Se apontar for difícil, aceite resposta por olhar, toque assistido ou fala.

    pictorico:
      status: VETADO
      motivo: "Sementes prioriza ordem vivida com objetos reais."
      excecao: "Se Quiser Voar"

    abstrato:
      desc: Vocabulário ordinal (primeiro ao quinto) após manipulação concreta.
      nota: A linguagem vem da experiência corporal de ordenar.

    extensao:
      titulo: Se Quiser Voar
      desc: Aplicar ordinais em cenas cotidianas.
      sugestoes:
        - titulo: Fila da Família
          acao: Forme uma fila com pessoas da casa e nomeie posições.
        - titulo: Trilha de Brinquedos
          acao: Organize brinquedos em fila e peça "mostre o quarto".
      adaptacao_bernardo: |
        Se cinco for excessivo, mantenha primeiro e último por alguns dias.
        Depois introduza segundo e terceiro.

  narracao:
    instrucao_portador: |
      Peça para a criança recontar quem estava em cada lugar na última rodada.
    pergunta_principal: Quem ficou em primeiro e quem ficou em último hoje?
    perguntas_coracao:
      - O que muda quando trocamos dois objetos de lugar?
      - Qual posição foi mais fácil de lembrar?
    nota_cm: Narração ajuda a distinguir quantidade (cardinal) de posição (ordinal).

  ritual_fechamento:
    fala_guardiao:
      tom: satisfeito
      script: |
        "Você leu a fila com atenção."
        "Agora cada lugar tem nome no seu coração."
    fio_ouro: Amanhã a jornada avança para 10 e 11, unindo ordem e quantidade em nova etapa.
    transicao_volta:
      instrucao: Guarde os objetos um por vez, repetindo a posição em que estavam.
      fala: Com ordem e calma, voltamos para casa.

  sementes_do_dia:
    titulo: Sementes para o Dia
    instrucao: |
      Faça pequenas práticas de ordenação em contextos reais para consolidar ordinais.
    atividades:
      - titulo: Ordinais na Rotina
        icone: ph-magnifying-glass
        acao: Identifique primeiro e último em uma fila real do dia (sapatos, livros, cadeiras).
        tipo: Exploração
        com_irmaos: true
      - titulo: Corrida de Personagens
        icone: ph-mask-happy
        acao: Dramatize uma corrida curta com brinquedos e anuncie as posições.
        tipo: Dramatização
        com_irmaos: true
      - titulo: Pista Numerada
        icone: ph-pencil-simple
        acao: Desenhe 5 casas no papel e coloque um objeto em cada posição.
        tipo: Criação
        com_irmaos: true
      - titulo: Relato da Fila
        icone: ph-chat-circle
        acao: A criança explica para alguém quem era o terceiro da fila e por quê.
        tipo: Narração
        com_irmaos: false
      - titulo: Pergunta da Noite
        icone: ph-moon
        acao: "Hoje você percebeu algo em que a ordem muda tudo?"
        tipo: Ritual Noturno
        com_irmaos: true
    frase_final: |
      Ordinais viram linguagem viva quando aparecem em filas e sequências do cotidiano.

  para_familia:
    titulo: A Ordem Importa
    porque_importa: |
      Números ordinais tratam de posição, não de quantidade.
      Essa distinção sustenta compreensão de instruções, leitura de sequência e organização mental.
      Em Sementes, o corpo organiza primeiro; a linguagem formal vem depois.
    metodo_cpa:
      concreto: Objetos em fila com troca real de posições.
      pictorico: Vetado no núcleo da lição.
      abstrato: Vocabulário ordinal consolidado pela narração.
      nota: "CM: Science of relations - aprender relações de posição."
    principio_cm:
      numero: 6
      citacao: "Education is the science of relations."
      aplicacao: Ordinais treinam relação entre elementos em sequência.
    tgtb_conexao: |
      Alinhada a 000-L10 (Ordinal Numbers Part 1), com foco em primeiro ao quinto.
    espiral:
      conceito: Números Ordinais
      volta_atual: "Sementes - posições em fila concreta"
      proxima_volta: "Raízes - ordinais em calendário, datas e sequências mais longas"
      nota: A base relacional evita confusão persistente entre cardinal e ordinal.
    reflexao_espiritual: |
      O lugar em uma fila muda, mas o valor da pessoa permanece.
      Ordem é serviço ao bem comum, não disputa de valor.
    nota_graca: |
      Se houver confusão, reduza para três posições por alguns dias.
      Clareza cresce com repetição curta e gentil.

  diario_portador:
    nota: Observe se a criança diferencia "três" de "terceiro" no uso espontâneo.
    perguntas:
      - Ela identifica posições sem depender de repetir toda a fila?
      - Trocar dois objetos ajudou a entender que ordinal é posição?

