# TEMPLATE V6.5 SEMENTES — YAML ESTRITO E CANÔNICO
# Versão: 6.5 | 04/03/2026 | Refs: LORE/index.yaml, triade.yaml
# Objetivo: servir como fonte única confiável para autoria, revisão e build.

_meta:
  id: template-v6.5-sementes
  versao: '6.5'
  fase: Sementes
  status: canonico
  ultima_atualizacao: '2026-03-04'
  refs:
    lore: LORE/index.yaml
    triade: .bmad/expansion-packs/matematica-viva/triade.yaml
    curriculo: curriculo/_SISTEMA/CURRICULOS_MESTRE/000_K_SEMENTES_CURRICULO_MESTRE.md
    padrao_visual: Revisao/padrao_visual_sementes.md
    framework_mestria: Revisao/framework_estrategia_mestria.md
  regras_ia:
    guardioes:
      fonte: LORE/guardioes.yaml
      opcoes: [melquior, noe, celeste, bernardo, iris]
    locais:
      fonte: LORE/locais.yaml
      opcoes: [jardim_central, arvore_silencio, clareira_perguntas, caverna_recomeco, ninho_mirante]
    climas:
      fonte: LORE/climas.yaml
      opcoes: [ensolarado, nublado, ventoso, chuvoso, outonal, primaveril, crepusculo, estrelado]
    virtudes:
      fonte: LORE/guardioes.yaml#semente
      evolucao: LORE/evolucao_guardioes.yaml
    cpa:
      fonte: .bmad/expansion-packs/matematica-viva/triade.yaml#ciclos.sementes.cpa
    limites:
      tempo_licao: '15-20 min'
      tempo_preparo: '≤ 5 min'
      fala_max_palavras: 50
    qualidade_yaml:
      usar_yaml_estrito: true
      encoding: utf-8
      evitar_mapas_inline_com_texto_longo: true
      exigir_aspas_em_strings_com_virgula: true
    narrativa_visual:
      termo_prioritario: maravilhamento
      evitar_caixa_alta_imperativa: true
      ritual_mostra_local_jornada_mostra_guardiao: true
      ordem_preferida_blocos: [Ritual de Entrada, A Jornada, O Concreto, Narramos Juntos, Ritual de Fechamento, Sementes para o Dia, Formação do Portador]
      sementes_do_dia_framework_5: [Exploração, Dramatização, Criação, Narração, Reflexão]
    compatibilidade:
      licao_000_liturgica_sem_objetivo_matematico: true
      sementes_do_dia_opcional_em_licoes_legado: true

licao:
  metadados:
    id: 'MV-S-XXX'
    titulo: '[Título Poético da Lição]'
    fase: Sementes
    ciclo: K
    trimestre: 1
    estacao: 1
    tipo: '[Senso Numérico, Operações, Geometria, Medidas, Posição e Espaço]'
    guardiao_lider: '[melquior|noe|celeste|bernardo|iris]'
    guardiao_secundario: null
    guardioes_apresentados: []
    tgtb_ref: '000-LXX'
    tgtb_titulo_en: '[Título original em inglês]'
    tgtb_titulo_pt: '[Tradução do tema]'
    objetivo_pedagogico: '[Opcional na L000 litúrgica]'
    tempo_licao: '15-20 min'
    tempo_preparo: '≤ 5 min'
    versao: '6.5'
    status: rascunho

  navegacao:
    # L000 pode usar `anterior: null`.
    anterior:
      id: 'MV-S-XXX'
      titulo: '[Título da lição anterior]'
    proxima:
      id: 'MV-S-XXX'
      titulo: '[Título da próxima lição]'

  para_portador:
    ideia_viva:
      frase: '[Frase poética da lição]'
      conceito: '[O que a criança descobre]'
      intencao_cm: '[Por que é ideia viva segundo CM]'
    dica_coracao: |
      [2-3 frases para acalmar e orientar o Portador]
    filho_descobre: |
      [Síntese do que a criança descobre]
    protocolo_impecabilidade: |
      [Regras práticas de condução: mostrar > explicar]
    nota_graca: |
      [Mensagem de descanso e não-culpa]
    conforto_emocional: |
      [Validação emocional ao Portador]
    audio_script: |
      [Script curto para escuta pré-lição]
    preparacao:
      materiais:
        - item: '[Nome do material]'
          qtd: 1
          alt: '[Alternativa]'
          essencial: true
          nota: '[Opcional]'

  linkage:
    # L000 pode usar `elo_anterior: null`.
    elo_anterior:
      licao_id: 'MV-S-XXX'
      gancho: '[Conexão com a lição anterior]'
    proximo:
      licao_id: 'MV-S-XXX'
      gancho: '[Gancho para a próxima lição]'

  ritual_abertura:
    instrucao_ambiente: |
      [Setup do ambiente]
    local: '[Ver LORE/locais.yaml]'
    clima: '[Ver LORE/climas.yaml]'
    virtude: '[Virtude semeada]'
    artefato: '[Objeto especial da lição]'
    transicao_reino: |
      [Texto de travessia para o Reino]
    fala_portador:
      tom: '[segredo|animado|solene|misterioso|delicado]'
      script: |
        [Fala inicial do Portador]
    card_guardiao: 'CARD: NOME_GUARDIAO'
    abertura_sensorial: |
      [Visão, som, cheiro, toque]

  jornada:
    narrativa_principal:
      - titulo: '[Cena 1]'
        local: '[LORE/local]'
        fala_guardiao:
          tom: '[acolhedor|curioso|firme|poetico|satisfeito]'
          script: |
            [Fala principal]
        instrucao_portador: |
          [Ação concreta para condução]
      - titulo: '[Cena 2]'
        local: '[LORE/local]'
        fala_guardiao:
          tom: '[...]'
          script: |
            [...]
        instrucao_portador: |
          [...]
      # Compatibilidade legada (L000):
      # - section: A Jornada
      #   items:
      #     - item: fala_guardiao
      #       guardiao: melquior
      #       tone: acolhedor
      #       text: |
      #         [...]

    concreto:
      desc: '[Descrição da atividade concreta]'
      card_objeto: 'CARD: NOME_OBJETO'
      metodo: mao-na-mao
      instrucoes_portador:
        - passo: 1
          acao: '[Ação do passo 1]'
          fala_sugerida: '[Fala sugerida]'
        - passo: 2
          acao: '[Ação do passo 2]'
          fala_sugerida: '[Fala sugerida]'
      norte_absoluto: '[Regra principal do bloco concreto]'
      adaptacao_bernardo: |
        [Adaptação inclusiva]

    pictorico:
      status: VETADO
      motivo: 'Sementes = Concreto. CM Things before Signs.'
      excecao: 'Se Quiser Voar'

    abstrato:
      desc: '[Reconhecimento abstrato mínimo]'
      nota: '[Traçar no ar pode contar como enativo, quando aplicável.]'

    extensao:
      titulo: 'Se Quiser Voar'
      desc: '[Extensão opcional]'
      nota_irmaos: '[Opcional]'
      sugestoes:
        - titulo: '[Nome da extensão]'
          acao: '[Descrição]'
          com_irmaos: true
      adaptacao_bernardo: |
        [Variações inclusivas]

  narracao:
    instrucao_portador: |
      [Orientação para narrar sem interromper]
    pergunta_principal: '[Pergunta aberta principal]'
    perguntas_coracao:
      - '[Pergunta 1]'
      - '[Pergunta 2]'
    nota_cm: |
      [Nota Charlotte Mason para narração]

  ritual_fechamento:
    fala_guardiao:
      tom: '[grato|acolhedor|satisfeito|esperançoso]'
      script: |
        [Reconhecimento + despedida + gancho]
    fio_ouro: '[Conexão explícita com a próxima lição]'
    transicao_volta:
      instrucao: '[Ação de encerramento]'
      fala: '[Frase final]'

  # Opcional em lições legadas, recomendado no padrão atual.
  sementes_do_dia:
    titulo: 'Sementes para o Dia'
    instrucao: |
      [Práticas opcionais para o dia]
    atividades:
      - titulo: '[Atividade 1]'
        icone: ph-magnifying-glass
        acao: '[Ação]'
        tipo: '[Exploração|Dramatização|Criação|Narração|Ritual Noturno]'
        com_irmaos: true
      - titulo: '[Atividade 2]'
        icone: ph-chat-circle
        acao: '[Ação]'
        tipo: '[Narração]'
        com_irmaos: false
    frase_final: |
      [Mensagem final de continuidade]

  para_familia:
    titulo: 'Entendendo a Jornada de Hoje'
    porque_importa: |
      [2-3 parágrafos de intencionalidade pedagógica]
    metodo_cpa:
      concreto: '[O que foi manipulado/tocado]'
      pictorico: '[Vetado em Sementes, salvo exceções]'
      abstrato: '[Reconhecimento mínimo]'
      nota: 'CM: Coisas antes de Signos.'
    principio_cm:
      numero: 1
      citacao: '[Citação original]'
      citacao_pt: '[Opcional]'
      aplicacao: '[Como a citação foi aplicada]'
    tgtb_conexao: |
      [Conexão com referência TGTB ou justificativa de não correspondência direta]
    espiral:
      conceito: '[Conceito matemático]'
      volta_atual: '[Sementes]'
      proxima_volta: '[Raízes]'
      nota: '[Como o conceito retorna em profundidade]'
    reflexao_espiritual: |
      [Opcional]
    nota_graca: |
      [Fechamento pastoral]

  diario_portador:
    nota: '[Uso em revisão trimestral]'
    perguntas:
      - '[Pergunta de observação 1]'
      - '[Pergunta de observação 2]'

  auditoria_qa:
    # Modelo de status de revisão (bools).
    cm: [true, true, true, true, true]
    cpa: [true, true, true]
    narrativa: [true, true, true, true]
    template: [true, true, true]
    triade: [true, true, true]
    inclusao: [true, true]
